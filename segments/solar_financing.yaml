segment:
  id: SOLAR_FINANCING
  version: 1
  channel: whatsapp
  languages: [hi, en]

data_sources:
  required: [CREDIT_BUREAU, BANK_ACCOUNT_AA, SOLAR_GENERATION]
  optional: [DISCOM_BILLS, SATELLITE_NDVI, DEVICE_SCORE]
  min_confidence: 0.5

scoring:
  model: solar_finance_score_v1
  features:
    - {name: solar_generation_kwh, source: SOLAR_GENERATION, weight: 0.20}
    - {name: grid_savings_monthly, source: DISCOM_BILLS, weight: 0.15}
    - {name: installation_capacity_kw, source: SOLAR_GENERATION, weight: 0.10}
    - {name: panel_degradation_rate, source: SOLAR_GENERATION, weight: 0.10}
    - {name: net_metering_active, source: DISCOM_BILLS, weight: 0.10}
    - {name: bureau_score, source: CREDIT_BUREAU, weight: 0.15}
    - {name: bank_stability, source: BANK_ACCOUNT_AA, weight: 0.20}

product:
  type: SOLAR_SAVINGS_LINKED
  amount_range: {min: 50000, max: 1000000}
  tenure_range: {min: 36, max: 84}
  schedule_template: savings_linked_monthly_v1
  insurance_required: SOLAR_PANEL_WARRANTY
  moratorium_triggers:
    - {type: MONSOON_LOW_GENERATION, threshold_pct: 40, duration_months: 2}
    - {type: PANEL_DAMAGE, threshold: detected, duration_months: 1}

monitoring:
  cadence: weekly
  signals: [SOLAR_GENERATION, DISCOM_BILLS]
  triggers:
    - {signal: generation_drop_pct, threshold: 30, intervention: PANEL_INSPECTION}
    - {signal: net_metering_disconnection, threshold: 1, intervention: ESCALATE}

graduation:
  min_repayment_months: 12
  min_on_time_rate: 0.90
  amount_multiplier: 1.5
  rate_reduction: 1.0

journey:
  entry: whatsapp_solar_inbound
  greeting: "Namaste! Solar panel financing ke liye baat karte hain. Bijli ki bachat se EMI bharein."
