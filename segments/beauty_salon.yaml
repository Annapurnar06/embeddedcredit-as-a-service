segment:
  id: BEAUTY_SALON
  version: 1
  channel: whatsapp
  languages: [hi, en]

data_sources:
  required: [CREDIT_BUREAU, BANK_ACCOUNT_AA, UPI_TRANSACTION_DATA]
  optional: [GST_RETURNS, BOOKING_PLATFORM_DATA, DEVICE_SCORE]
  min_confidence: 0.4

scoring:
  model: beauty_salon_score_v1
  features:
    - {name: upi_daily_collections, source: UPI_TRANSACTION_DATA, weight: 0.25}
    - {name: booking_regularity, source: BOOKING_PLATFORM_DATA, weight: 0.15}
    - {name: customer_retention_rate, source: BOOKING_PLATFORM_DATA, weight: 0.10}
    - {name: gst_turnover_trend, source: GST_RETURNS, weight: 0.10}
    - {name: bureau_score, source: CREDIT_BUREAU, weight: 0.15}
    - {name: bank_stability, source: BANK_ACCOUNT_AA, weight: 0.25}

product:
  type: MICRO_BUSINESS_LOAN
  amount_range: {min: 25000, max: 300000}
  tenure_range: {min: 6, max: 24}
  schedule_template: daily_upi_v1
  insurance_required: false

monitoring:
  cadence: weekly
  signals: [UPI_TRANSACTION_DATA, BANK_ACCOUNT_AA]
  triggers:
    - {signal: upi_collection_drop_pct, threshold: 40, intervention: SCHEDULE_ADJUST}

graduation:
  min_repayment_months: 6
  min_on_time_rate: 0.85
  amount_multiplier: 1.5
  rate_reduction: 1.5

journey:
  entry: whatsapp_salon_inbound
  greeting: "Namaste! Salon business ke liye loan ki baat karte hain."
