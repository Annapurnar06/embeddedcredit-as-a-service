segment:
  id: MSE_MANUFACTURING
  version: 1
  channel: whatsapp
  languages: [hi, en, ta]

data_sources:
  required: [CREDIT_BUREAU, BANK_ACCOUNT_AA, GST_RETURNS, UDYAM_REGISTRATION]
  optional: [POWER_CONSUMPTION, DEVICE_SCORE]
  min_confidence: 0.5

scoring:
  model: mse_mfg_score_v1
  features:
    - {name: gst_turnover_trend, source: GST_RETURNS, weight: 0.20}
    - {name: power_consumption_trend, source: POWER_CONSUMPTION, weight: 0.15}
    - {name: udyam_registration_vintage, source: UDYAM_REGISTRATION, weight: 0.10}
    - {name: gst_filing_regularity, source: GST_RETURNS, weight: 0.10}
    - {name: bank_inflow_regularity, source: BANK_ACCOUNT_AA, weight: 0.15}
    - {name: bureau_score, source: CREDIT_BUREAU, weight: 0.15}
    - {name: bank_stability, source: BANK_ACCOUNT_AA, weight: 0.15}

product:
  type: TERM_LOAN_MSE
  amount_range: {min: 200000, max: 5000000}
  tenure_range: {min: 12, max: 60}
  schedule_template: monthly_emi_v1
  insurance_required: MACHINERY_INSURANCE
  moratorium_triggers:
    - {type: RAW_MATERIAL_SHORTAGE, threshold: declared, duration_months: 2}

monitoring:
  cadence: monthly
  signals: [GST_RETURNS, BANK_ACCOUNT_AA, POWER_CONSUMPTION]
  triggers:
    - {signal: turnover_drop_pct, threshold: 30, intervention: LIMIT_REVIEW}
    - {signal: power_consumption_drop_pct, threshold: 50, intervention: SITE_VISIT}

graduation:
  min_repayment_months: 12
  min_on_time_rate: 0.90
  amount_multiplier: 1.5
  rate_reduction: 1.0

journey:
  entry: whatsapp_mse_inbound
  greeting: "Namaste! Aapke manufacturing business ke liye loan ki baat karte hain."
