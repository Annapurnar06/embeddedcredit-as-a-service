segment:
  id: WAREHOUSE_RECEIPT
  version: 1
  channel: whatsapp
  languages: [hi, en]

data_sources:
  required: [CREDIT_BUREAU, BANK_ACCOUNT_AA, WAREHOUSE_RECEIPT_REGISTRY]
  optional: [LAND_RECORDS, SATELLITE_NDVI, MANDI_PRICES]
  min_confidence: 0.5

scoring:
  model: warehouse_receipt_score_v1
  features:
    - {name: commodity_value_stability, source: MANDI_PRICES, weight: 0.20}
    - {name: warehouse_grade, source: WAREHOUSE_RECEIPT_REGISTRY, weight: 0.15}
    - {name: storage_duration, source: WAREHOUSE_RECEIPT_REGISTRY, weight: 0.10}
    - {name: commodity_liquidity, source: MANDI_PRICES, weight: 0.15}
    - {name: bureau_score, source: CREDIT_BUREAU, weight: 0.15}
    - {name: bank_stability, source: BANK_ACCOUNT_AA, weight: 0.15}
    - {name: past_repayment_history, source: CREDIT_BUREAU, weight: 0.10}

product:
  type: WAREHOUSE_RECEIPT_PLEDGE
  amount_range: {min: 50000, max: 2500000}
  tenure_range: {min: 3, max: 12}
  schedule_template: bullet_at_harvest_v1
  insurance_required: COMMODITY_INSURANCE
  ltv_ratio: 0.70
  moratorium_triggers:
    - {type: COMMODITY_PRICE_CRASH, threshold_percent: 30, intervention: LTV_REVIEW}
    - {type: QUALITY_DEGRADATION, threshold: detected, intervention: FORCED_SALE}

monitoring:
  cadence: weekly
  signals: [MANDI_PRICES, WAREHOUSE_RECEIPT_REGISTRY]
  triggers:
    - {signal: commodity_price_drop_pct, threshold: 20, intervention: MARGIN_CALL}
    - {signal: storage_quality_flag, threshold: 1, intervention: PHYSICAL_INSPECTION}

graduation:
  min_repayment_months: 6
  min_on_time_rate: 0.90
  amount_multiplier: 1.5
  rate_reduction: 1.5

journey:
  entry: whatsapp_warehouse_inbound
  greeting: "Namaste! Aapke warehouse receipt ke against loan ke liye baat karte hain."
