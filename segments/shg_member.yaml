segment:
  id: SHG_MEMBER
  version: 1
  channel: whatsapp
  languages: [hi, te, ta, kn, or]

data_sources:
  required: [CREDIT_BUREAU, BANK_ACCOUNT_AA, SHG_RECORDS]
  optional: [NRLM_DATABASE, DEVICE_SCORE]
  min_confidence: 0.4

scoring:
  model: shg_score_v1
  features:
    - {name: group_repayment_rate, source: SHG_RECORDS, weight: 0.25}
    - {name: group_meeting_attendance, source: SHG_RECORDS, weight: 0.15}
    - {name: individual_savings_regularity, source: SHG_RECORDS, weight: 0.15}
    - {name: group_tenure_months, source: SHG_RECORDS, weight: 0.10}
    - {name: nrlm_grading, source: NRLM_DATABASE, weight: 0.10}
    - {name: bureau_score, source: CREDIT_BUREAU, weight: 0.10}
    - {name: bank_stability, source: BANK_ACCOUNT_AA, weight: 0.15}

product:
  type: SHG_GROUP_LINKED
  amount_range: {min: 10000, max: 200000}
  tenure_range: {min: 6, max: 24}
  schedule_template: monthly_group_v1
  insurance_required: false
  group_guarantee: true
  moratorium_triggers:
    - {type: NATURAL_DISASTER, threshold: declared, duration_months: 3}
    - {type: GROUP_DISSOLUTION, threshold: 1, intervention: INDIVIDUAL_RESTRUCTURE}

monitoring:
  cadence: monthly
  signals: [SHG_RECORDS, BANK_ACCOUNT_AA]
  triggers:
    - {signal: group_repayment_drop_pct, threshold: 20, intervention: GROUP_COUNSELING}
    - {signal: individual_default, threshold: 1, intervention: GROUP_NOTIFICATION}

graduation:
  min_repayment_months: 12
  min_on_time_rate: 0.85
  amount_multiplier: 2.0
  rate_reduction: 2.0

journey:
  entry: whatsapp_shg_inbound
  greeting: "Namaste didi! Aapke self-help group ke liye loan ki baat karte hain."
