segment:
  id: KIRANA_SHOP
  version: 1
  channel: whatsapp
  languages: [hi, mr]

data_sources:
  required: [CREDIT_BUREAU, BANK_ACCOUNT_AA, GST_RETURNS]
  optional: [PLATFORM_EARNINGS, DEVICE_SCORE]
  min_confidence: 0.5

scoring:
  model: vendor_score_v1
  features:
    - {name: gst_turnover_trend, source: GST_RETURNS, weight: 0.30}
    - {name: bank_inflow_regularity, source: BANK_ACCOUNT_AA, weight: 0.25}
    - {name: bureau_score, source: CREDIT_BUREAU, weight: 0.20}
    - {name: gst_filing_regularity, source: GST_RETURNS, weight: 0.15}
    - {name: device_score, source: DEVICE_SCORE, weight: 0.10}

product:
  type: DAILY_MICRO
  amount_range: {min: 50000, max: 500000}
  tenure_range: {min: 3, max: 12}
  schedule_template: daily_micro_v1
  insurance_required: false

monitoring:
  cadence: daily
  signals: [BANK_ACCOUNT_AA, GST_RETURNS]
  triggers:
    - {signal: daily_inflow_drop_pct, threshold: 50, intervention: SCHEDULE_ADJUST}

graduation:
  min_repayment_months: 6
  min_on_time_rate: 0.85
  amount_multiplier: 1.5
  rate_reduction: 1.5

journey:
  entry: whatsapp_kirana_inbound
  greeting: "Namaste! Aapki dukan ke liye business loan ke baare mein baat karte hain."
