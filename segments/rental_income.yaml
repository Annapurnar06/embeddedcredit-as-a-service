segment:
  id: RENTAL_INCOME
  version: 1
  channel: whatsapp
  languages: [hi, en]

data_sources:
  required: [CREDIT_BUREAU, BANK_ACCOUNT_AA, PROPERTY_RECORDS]
  optional: [RENTAL_AGREEMENTS, DEVICE_SCORE]
  min_confidence: 0.5

scoring:
  model: rental_income_score_v1
  features:
    - {name: rental_income_regularity, source: BANK_ACCOUNT_AA, weight: 0.25}
    - {name: property_count, source: PROPERTY_RECORDS, weight: 0.10}
    - {name: occupancy_rate, source: RENTAL_AGREEMENTS, weight: 0.15}
    - {name: rental_yield_pct, source: RENTAL_AGREEMENTS, weight: 0.10}
    - {name: bureau_score, source: CREDIT_BUREAU, weight: 0.20}
    - {name: bank_stability, source: BANK_ACCOUNT_AA, weight: 0.20}

product:
  type: RENTAL_ADVANCE_LOAN
  amount_range: {min: 100000, max: 2000000}
  tenure_range: {min: 12, max: 60}
  schedule_template: monthly_emi_v1
  insurance_required: false

monitoring:
  cadence: monthly
  signals: [BANK_ACCOUNT_AA, RENTAL_AGREEMENTS]
  triggers:
    - {signal: rental_income_drop_pct, threshold: 30, intervention: TENANT_REVIEW}
    - {signal: vacancy_months, threshold: 3, intervention: RESTRUCTURE}

graduation:
  min_repayment_months: 12
  min_on_time_rate: 0.90
  amount_multiplier: 1.5
  rate_reduction: 1.0

journey:
  entry: whatsapp_rental_inbound
  greeting: "Namaste! Rental income ke basis par loan ki baat karte hain."
