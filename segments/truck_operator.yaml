segment:
  id: TRUCK_OPERATOR
  version: 1
  channel: whatsapp
  languages: [hi, en]

data_sources:
  required: [CREDIT_BUREAU, BANK_ACCOUNT_AA, VEHICLE_TELEMATICS, FASTAG_DATA]
  optional: [PLATFORM_EARNINGS, DEVICE_SCORE]
  min_confidence: 0.5

scoring:
  model: truck_operator_score_v1
  features:
    - {name: monthly_km_driven, source: VEHICLE_TELEMATICS, weight: 0.20}
    - {name: fastag_trip_regularity, source: FASTAG_DATA, weight: 0.15}
    - {name: fuel_efficiency, source: VEHICLE_TELEMATICS, weight: 0.10}
    - {name: load_utilization_pct, source: VEHICLE_TELEMATICS, weight: 0.10}
    - {name: platform_earnings_trend, source: PLATFORM_EARNINGS, weight: 0.10}
    - {name: bureau_score, source: CREDIT_BUREAU, weight: 0.15}
    - {name: bank_stability, source: BANK_ACCOUNT_AA, weight: 0.20}

product:
  type: VEHICLE_FINANCE_CV
  amount_range: {min: 200000, max: 3000000}
  tenure_range: {min: 24, max: 60}
  schedule_template: monthly_emi_v1
  insurance_required: CV_COMPREHENSIVE
  moratorium_triggers:
    - {type: VEHICLE_BREAKDOWN, threshold: detected, duration_months: 1}
    - {type: PERMIT_SUSPENSION, threshold: 1, duration_months: 1}

monitoring:
  cadence: daily
  signals: [VEHICLE_TELEMATICS, FASTAG_DATA, BANK_ACCOUNT_AA]
  triggers:
    - {signal: km_driven_drop_pct, threshold: 50, intervention: DRIVER_CONTACT}
    - {signal: vehicle_idle_days, threshold: 7, intervention: ESCALATE}

graduation:
  min_repayment_months: 12
  min_on_time_rate: 0.90
  amount_multiplier: 1.5
  rate_reduction: 1.0

journey:
  entry: whatsapp_truck_inbound
  greeting: "Namaste driver sahab! Truck loan ke baare mein baat karte hain."
