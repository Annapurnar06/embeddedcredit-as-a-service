segment:
  id: VEGETABLE_GROWER
  version: 1
  channel: whatsapp
  languages: [hi, mr, te]

data_sources:
  required: [CREDIT_BUREAU, BANK_ACCOUNT_AA, FPO_DATA]
  optional: [LAND_RECORDS, SATELLITE_NDVI, MANDI_PRICES, WEATHER_IMD]
  min_confidence: 0.4

scoring:
  model: vegetable_grower_score_v1
  features:
    - {name: fpo_supply_regularity, source: FPO_DATA, weight: 0.20}
    - {name: mandi_price_realization, source: MANDI_PRICES, weight: 0.15}
    - {name: crop_diversification, source: FPO_DATA, weight: 0.10}
    - {name: land_area_acres, source: LAND_RECORDS, weight: 0.10}
    - {name: ndvi_crop_health, source: SATELLITE_NDVI, weight: 0.05}
    - {name: bureau_score, source: CREDIT_BUREAU, weight: 0.15}
    - {name: bank_stability, source: BANK_ACCOUNT_AA, weight: 0.25}

product:
  type: SHORT_CROP_CYCLE
  amount_range: {min: 20000, max: 300000}
  tenure_range: {min: 3, max: 9}
  schedule_template: crop_cycle_v1
  insurance_required: PMFBY
  moratorium_triggers:
    - {type: UNSEASONAL_RAIN, threshold: declared, duration_months: 1}
    - {type: PEST_OUTBREAK, threshold: declared, duration_months: 1}

monitoring:
  cadence: weekly
  signals: [FPO_DATA, MANDI_PRICES, WEATHER_IMD]
  triggers:
    - {signal: mandi_price_crash_pct, threshold: 30, intervention: SCHEDULE_ADJUST}
    - {signal: crop_damage_pct, threshold: 50, intervention: INSURANCE_CLAIM}

graduation:
  min_repayment_months: 6
  min_on_time_rate: 0.85
  amount_multiplier: 2.0
  rate_reduction: 2.0

journey:
  entry: whatsapp_vegetable_inbound
  greeting: "Namaste! Sabzi ki kheti ke liye loan ki baat karte hain."
