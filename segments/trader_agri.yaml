segment:
  id: TRADER_AGRI
  version: 1
  channel: whatsapp
  languages: [hi, en]

data_sources:
  required: [CREDIT_BUREAU, BANK_ACCOUNT_AA, MANDI_LICENCE, GST_RETURNS]
  optional: [PLATFORM_EARNINGS, MANDI_PRICES]
  min_confidence: 0.5

scoring:
  model: agri_trader_score_v1
  features:
    - {name: mandi_turnover_trend, source: MANDI_LICENCE, weight: 0.25}
    - {name: gst_filing_regularity, source: GST_RETURNS, weight: 0.15}
    - {name: commodity_diversification, source: MANDI_LICENCE, weight: 0.10}
    - {name: trading_tenure_years, source: MANDI_LICENCE, weight: 0.10}
    - {name: bureau_score, source: CREDIT_BUREAU, weight: 0.20}
    - {name: bank_stability, source: BANK_ACCOUNT_AA, weight: 0.20}

product:
  type: WORKING_CAPITAL_SEASONAL
  amount_range: {min: 100000, max: 5000000}
  tenure_range: {min: 3, max: 12}
  schedule_template: seasonal_bullet_v1
  insurance_required: false
  moratorium_triggers:
    - {type: MANDI_CLOSURE, threshold: declared, duration_months: 1}

monitoring:
  cadence: weekly
  signals: [BANK_ACCOUNT_AA, GST_RETURNS, MANDI_PRICES]
  triggers:
    - {signal: turnover_drop_pct, threshold: 40, intervention: LIMIT_REVIEW}
    - {signal: gst_filing_gap, threshold: 2, intervention: ESCALATE}

graduation:
  min_repayment_months: 6
  min_on_time_rate: 0.90
  amount_multiplier: 1.5
  rate_reduction: 1.5

journey:
  entry: whatsapp_trader_inbound
  greeting: "Namaste! Mandi trading ke liye working capital loan ki baat karte hain."
