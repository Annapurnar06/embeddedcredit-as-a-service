segment:
  id: HEALTH_CLINIC
  version: 1
  channel: whatsapp
  languages: [hi, en]

data_sources:
  required: [CREDIT_BUREAU, BANK_ACCOUNT_AA, MEDICAL_LICENSE]
  optional: [GST_RETURNS, UPI_TRANSACTION_DATA, DEVICE_SCORE]
  min_confidence: 0.5

scoring:
  model: health_clinic_score_v1
  features:
    - {name: patient_footfall_trend, source: UPI_TRANSACTION_DATA, weight: 0.20}
    - {name: medical_license_validity, source: MEDICAL_LICENSE, weight: 0.10}
    - {name: gst_turnover_trend, source: GST_RETURNS, weight: 0.15}
    - {name: bank_inflow_regularity, source: BANK_ACCOUNT_AA, weight: 0.15}
    - {name: bureau_score, source: CREDIT_BUREAU, weight: 0.15}
    - {name: bank_stability, source: BANK_ACCOUNT_AA, weight: 0.25}

product:
  type: EQUIPMENT_FINANCE
  amount_range: {min: 100000, max: 2000000}
  tenure_range: {min: 12, max: 48}
  schedule_template: monthly_emi_v1
  insurance_required: EQUIPMENT_INSURANCE

monitoring:
  cadence: monthly
  signals: [BANK_ACCOUNT_AA, GST_RETURNS]
  triggers:
    - {signal: turnover_drop_pct, threshold: 30, intervention: OUTREACH}
    - {signal: license_expiry, threshold: 30, intervention: LICENSE_RENEWAL_ALERT}

graduation:
  min_repayment_months: 12
  min_on_time_rate: 0.90
  amount_multiplier: 1.5
  rate_reduction: 1.0

journey:
  entry: whatsapp_clinic_inbound
  greeting: "Namaste doctor! Clinic equipment ke liye loan ki baat karte hain."
