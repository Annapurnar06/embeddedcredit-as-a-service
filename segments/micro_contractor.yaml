segment:
  id: MICRO_CONTRACTOR
  version: 1
  channel: whatsapp
  languages: [hi, en]

data_sources:
  required: [CREDIT_BUREAU, BANK_ACCOUNT_AA, GST_RETURNS]
  optional: [GEM_PORTAL_DATA, WORK_ORDER_DATA, DEVICE_SCORE]
  min_confidence: 0.5

scoring:
  model: micro_contractor_score_v1
  features:
    - {name: work_order_pipeline, source: WORK_ORDER_DATA, weight: 0.20}
    - {name: gem_portal_rating, source: GEM_PORTAL_DATA, weight: 0.10}
    - {name: gst_turnover_trend, source: GST_RETURNS, weight: 0.15}
    - {name: project_completion_rate, source: WORK_ORDER_DATA, weight: 0.15}
    - {name: bureau_score, source: CREDIT_BUREAU, weight: 0.15}
    - {name: bank_stability, source: BANK_ACCOUNT_AA, weight: 0.25}

product:
  type: PROJECT_FINANCE
  amount_range: {min: 200000, max: 5000000}
  tenure_range: {min: 6, max: 24}
  schedule_template: milestone_linked_v1
  insurance_required: false
  moratorium_triggers:
    - {type: PROJECT_DELAY, threshold_days: 30, duration_months: 1}

monitoring:
  cadence: monthly
  signals: [BANK_ACCOUNT_AA, WORK_ORDER_DATA]
  triggers:
    - {signal: work_order_cancellation, threshold: 1, intervention: PIPELINE_REVIEW}
    - {signal: receivable_overdue_days, threshold: 60, intervention: ESCALATE}

graduation:
  min_repayment_months: 12
  min_on_time_rate: 0.90
  amount_multiplier: 1.5
  rate_reduction: 1.0

journey:
  entry: whatsapp_contractor_inbound
  greeting: "Namaste! Contract work ke liye project finance ki baat karte hain."
