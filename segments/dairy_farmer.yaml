segment:
  id: DAIRY_FARMER
  version: 1
  channel: whatsapp
  languages: [gu, hi]

data_sources:
  required: [CREDIT_BUREAU, BANK_ACCOUNT_AA, DAIRY_COOPERATIVE]
  optional: [LAND_RECORDS, SATELLITE_NDVI, WEATHER_IMD]
  min_confidence: 0.5

scoring:
  model: dairy_score_v1
  features:
    - {name: pouring_regularity, source: DAIRY_COOPERATIVE, weight: 0.25}
    - {name: pouring_volume_trend, source: DAIRY_COOPERATIVE, weight: 0.18}
    - {name: cooperative_tenure, source: DAIRY_COOPERATIVE, weight: 0.12}
    - {name: land_area, source: LAND_RECORDS, weight: 0.10}
    - {name: bureau_score, source: CREDIT_BUREAU, weight: 0.15}
    - {name: bank_stability, source: BANK_ACCOUNT_AA, weight: 0.20}

product:
  type: SEASONAL_DYNAMIC
  amount_range: {min: 25000, max: 200000}
  tenure_range: {min: 6, max: 24}
  schedule_template: dairy_seasonal_v1
  insurance_required: PASHU_BIMA
  moratorium_triggers:
    - {type: WEATHER_HEAT, threshold_celsius: 38, duration_months: 1}
    - {type: PRODUCTION_DROP, threshold_percent: 40, duration_months: 1}

monitoring:
  cadence: weekly
  signals: [DAIRY_COOPERATIVE, WEATHER_IMD, BANK_ACCOUNT_AA]
  triggers:
    - {signal: pouring_drop_pct, threshold: 30, intervention: SCHEDULE_ADJUST}
    - {signal: temperature_celsius, threshold: 38, intervention: AUTO_MORATORIUM}

graduation:
  min_repayment_months: 12
  min_on_time_rate: 0.90
  amount_multiplier: 2.0
  rate_reduction: 2.0

journey:
  entry: whatsapp_dairy_inbound
  greeting: "Namaste, {name}bhai. Aapne cooperative loan ke liye contact kiya hai."
