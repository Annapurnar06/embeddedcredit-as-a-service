segment:
  id: MEDICAL_SHOP
  version: 1
  channel: whatsapp
  languages: [hi, en]

data_sources:
  required: [CREDIT_BUREAU, BANK_ACCOUNT_AA, GST_RETURNS, DRUG_LICENSE]
  optional: [DISTRIBUTOR_DATA, DEVICE_SCORE]
  min_confidence: 0.5

scoring:
  model: medical_shop_score_v1
  features:
    - {name: gst_turnover_trend, source: GST_RETURNS, weight: 0.20}
    - {name: drug_license_validity, source: DRUG_LICENSE, weight: 0.10}
    - {name: distributor_credit_terms, source: DISTRIBUTOR_DATA, weight: 0.10}
    - {name: bank_inflow_regularity, source: BANK_ACCOUNT_AA, weight: 0.15}
    - {name: gst_filing_regularity, source: GST_RETURNS, weight: 0.10}
    - {name: bureau_score, source: CREDIT_BUREAU, weight: 0.15}
    - {name: bank_stability, source: BANK_ACCOUNT_AA, weight: 0.20}

product:
  type: INVENTORY_FINANCE
  amount_range: {min: 100000, max: 1000000}
  tenure_range: {min: 6, max: 24}
  schedule_template: monthly_emi_v1
  insurance_required: false

monitoring:
  cadence: weekly
  signals: [BANK_ACCOUNT_AA, GST_RETURNS]
  triggers:
    - {signal: turnover_drop_pct, threshold: 30, intervention: LIMIT_REVIEW}
    - {signal: drug_license_expiry, threshold: 30, intervention: ESCALATE}

graduation:
  min_repayment_months: 6
  min_on_time_rate: 0.90
  amount_multiplier: 1.5
  rate_reduction: 1.0

journey:
  entry: whatsapp_medical_inbound
  greeting: "Namaste! Medical shop ke liye inventory loan ki baat karte hain."
