segment:
  id: RICE_MILLER
  version: 1
  channel: whatsapp
  languages: [hi, pa, en]

data_sources:
  required: [CREDIT_BUREAU, BANK_ACCOUNT_AA, GST_RETURNS, RICE_MILL_LICENSE]
  optional: [PROCUREMENT_DATA, WAREHOUSE_RECEIPT_REGISTRY]
  min_confidence: 0.5

scoring:
  model: rice_miller_score_v1
  features:
    - {name: milling_capacity_utilization, source: RICE_MILL_LICENSE, weight: 0.15}
    - {name: gst_turnover_trend, source: GST_RETURNS, weight: 0.20}
    - {name: procurement_regularity, source: PROCUREMENT_DATA, weight: 0.15}
    - {name: warehouse_stock_turnover, source: WAREHOUSE_RECEIPT_REGISTRY, weight: 0.10}
    - {name: bureau_score, source: CREDIT_BUREAU, weight: 0.15}
    - {name: bank_stability, source: BANK_ACCOUNT_AA, weight: 0.25}

product:
  type: PROCUREMENT_FINANCE
  amount_range: {min: 500000, max: 10000000}
  tenure_range: {min: 3, max: 9}
  schedule_template: seasonal_bullet_v1
  insurance_required: STOCK_INSURANCE

monitoring:
  cadence: weekly
  signals: [GST_RETURNS, BANK_ACCOUNT_AA, WAREHOUSE_RECEIPT_REGISTRY]
  triggers:
    - {signal: stock_overhang_days, threshold: 60, intervention: FORCED_SALE_REVIEW}
    - {signal: turnover_drop_pct, threshold: 30, intervention: LIMIT_REVIEW}

graduation:
  min_repayment_months: 6
  min_on_time_rate: 0.90
  amount_multiplier: 1.5
  rate_reduction: 1.0

journey:
  entry: whatsapp_rice_miller_inbound
  greeting: "Namaste! Rice mill ke liye procurement finance ki baat karte hain."
