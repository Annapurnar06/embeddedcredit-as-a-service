segment:
  id: FPO_ENTITY
  version: 1
  channel: whatsapp
  languages: [hi, en]

data_sources:
  required: [CREDIT_BUREAU, BANK_ACCOUNT_AA, FPO_DATA, GST_RETURNS]
  optional: [NABARD_GRADING, SFAC_DATA]
  min_confidence: 0.5

scoring:
  model: fpo_entity_score_v1
  features:
    - {name: member_count, source: FPO_DATA, weight: 0.10}
    - {name: aggregation_volume_trend, source: FPO_DATA, weight: 0.20}
    - {name: gst_turnover_trend, source: GST_RETURNS, weight: 0.15}
    - {name: nabard_grading, source: NABARD_GRADING, weight: 0.10}
    - {name: governance_score, source: FPO_DATA, weight: 0.10}
    - {name: bureau_score, source: CREDIT_BUREAU, weight: 0.15}
    - {name: bank_stability, source: BANK_ACCOUNT_AA, weight: 0.20}

product:
  type: FPO_WORKING_CAPITAL
  amount_range: {min: 500000, max: 10000000}
  tenure_range: {min: 6, max: 18}
  schedule_template: seasonal_bullet_v1
  insurance_required: false
  moratorium_triggers:
    - {type: CROP_FAILURE_REGIONAL, threshold: declared, duration_months: 3}

monitoring:
  cadence: monthly
  signals: [FPO_DATA, BANK_ACCOUNT_AA, GST_RETURNS]
  triggers:
    - {signal: aggregation_drop_pct, threshold: 30, intervention: MANAGEMENT_REVIEW}
    - {signal: member_dropout_rate, threshold: 10, intervention: GOVERNANCE_AUDIT}

graduation:
  min_repayment_months: 12
  min_on_time_rate: 0.90
  amount_multiplier: 1.5
  rate_reduction: 1.0

journey:
  entry: whatsapp_fpo_inbound
  greeting: "Namaste! FPO ke liye working capital loan ki baat karte hain."
