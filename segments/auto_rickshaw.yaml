segment:
  id: AUTO_RICKSHAW
  version: 1
  channel: whatsapp
  languages: [hi, ta, kn]

data_sources:
  required: [CREDIT_BUREAU, BANK_ACCOUNT_AA, VEHICLE_TELEMATICS]
  optional: [PLATFORM_EARNINGS, UPI_TRANSACTION_DATA, DEVICE_SCORE]
  min_confidence: 0.4

scoring:
  model: auto_rickshaw_score_v1
  features:
    - {name: daily_trips, source: VEHICLE_TELEMATICS, weight: 0.20}
    - {name: daily_km_driven, source: VEHICLE_TELEMATICS, weight: 0.15}
    - {name: upi_daily_collections, source: UPI_TRANSACTION_DATA, weight: 0.15}
    - {name: platform_rating, source: PLATFORM_EARNINGS, weight: 0.10}
    - {name: bureau_score, source: CREDIT_BUREAU, weight: 0.15}
    - {name: bank_stability, source: BANK_ACCOUNT_AA, weight: 0.25}

product:
  type: THREE_WHEELER_FINANCE
  amount_range: {min: 50000, max: 400000}
  tenure_range: {min: 12, max: 48}
  schedule_template: daily_payout_linked_v1
  insurance_required: THREE_WHEELER_COMPREHENSIVE
  moratorium_triggers:
    - {type: VEHICLE_BREAKDOWN, threshold: detected, duration_months: 1}
    - {type: FLOOD_WATERLOGGING, threshold: declared, duration_months: 1}

monitoring:
  cadence: daily
  signals: [VEHICLE_TELEMATICS, UPI_TRANSACTION_DATA]
  triggers:
    - {signal: daily_trip_drop_pct, threshold: 50, intervention: SCHEDULE_ADJUST}
    - {signal: vehicle_idle_days, threshold: 5, intervention: DRIVER_CONTACT}

graduation:
  min_repayment_months: 12
  min_on_time_rate: 0.85
  amount_multiplier: 1.5
  rate_reduction: 1.5

journey:
  entry: whatsapp_auto_inbound
  greeting: "Namaste! Auto rickshaw loan ke liye baat karte hain. Daily kamai se EMI kategi."
