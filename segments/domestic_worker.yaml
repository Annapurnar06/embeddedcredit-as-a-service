segment:
  id: DOMESTIC_WORKER
  version: 1
  channel: whatsapp
  languages: [hi, bn, en]

data_sources:
  required: [CREDIT_BUREAU, BANK_ACCOUNT_AA]
  optional: [EMPLOYER_VERIFICATION, UPI_TRANSACTION_DATA, DEVICE_SCORE]
  min_confidence: 0.3

scoring:
  model: domestic_worker_score_v1
  features:
    - {name: employer_count, source: EMPLOYER_VERIFICATION, weight: 0.15}
    - {name: employment_tenure_months, source: EMPLOYER_VERIFICATION, weight: 0.15}
    - {name: upi_inflow_regularity, source: UPI_TRANSACTION_DATA, weight: 0.15}
    - {name: monthly_income_estimate, source: BANK_ACCOUNT_AA, weight: 0.15}
    - {name: bureau_score, source: CREDIT_BUREAU, weight: 0.15}
    - {name: bank_stability, source: BANK_ACCOUNT_AA, weight: 0.25}

product:
  type: NANO_LOAN
  amount_range: {min: 5000, max: 50000}
  tenure_range: {min: 3, max: 12}
  schedule_template: weekly_v1
  insurance_required: false

monitoring:
  cadence: weekly
  signals: [BANK_ACCOUNT_AA]
  triggers:
    - {signal: income_drop_pct, threshold: 40, intervention: SCHEDULE_ADJUST}

graduation:
  min_repayment_months: 6
  min_on_time_rate: 0.80
  amount_multiplier: 2.0
  rate_reduction: 3.0

journey:
  entry: whatsapp_domestic_inbound
  greeting: "Namaste didi! Chhota loan ke baare mein baat karte hain."
