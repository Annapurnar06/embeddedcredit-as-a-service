segment:
  id: CONSTRUCTION_WORKER
  version: 1
  channel: whatsapp
  languages: [hi, en]

data_sources:
  required: [CREDIT_BUREAU, BANK_ACCOUNT_AA, EPFO_DATA]
  optional: [BOCW_REGISTRATION, UPI_TRANSACTION_DATA, DEVICE_SCORE]
  min_confidence: 0.4

scoring:
  model: construction_worker_score_v1
  features:
    - {name: epfo_contribution_regularity, source: EPFO_DATA, weight: 0.20}
    - {name: employer_stability, source: EPFO_DATA, weight: 0.15}
    - {name: bocw_registration_active, source: BOCW_REGISTRATION, weight: 0.10}
    - {name: upi_inflow_regularity, source: UPI_TRANSACTION_DATA, weight: 0.15}
    - {name: bureau_score, source: CREDIT_BUREAU, weight: 0.15}
    - {name: bank_stability, source: BANK_ACCOUNT_AA, weight: 0.25}

product:
  type: INCOME_SMOOTHING_LOAN
  amount_range: {min: 10000, max: 100000}
  tenure_range: {min: 3, max: 12}
  schedule_template: weekly_v1
  insurance_required: false
  moratorium_triggers:
    - {type: MONSOON_WORK_STOPPAGE, threshold: heavy_rain_days_gt_5, duration_months: 1}
    - {type: SITE_ACCIDENT, threshold: 1, duration_months: 2}

monitoring:
  cadence: weekly
  signals: [BANK_ACCOUNT_AA, EPFO_DATA]
  triggers:
    - {signal: income_drop_pct, threshold: 40, intervention: SCHEDULE_ADJUST}
    - {signal: employer_change, threshold: 1, intervention: INCOME_REVERIFY}

graduation:
  min_repayment_months: 6
  min_on_time_rate: 0.80
  amount_multiplier: 2.0
  rate_reduction: 2.0

journey:
  entry: whatsapp_construction_inbound
  greeting: "Namaste bhai! Construction worker loan ke baare mein baat karte hain."
