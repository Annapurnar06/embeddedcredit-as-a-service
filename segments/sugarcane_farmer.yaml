segment:
  id: SUGARCANE_FARMER
  version: 1
  channel: whatsapp
  languages: [hi, mr]

data_sources:
  required: [CREDIT_BUREAU, BANK_ACCOUNT_AA, SUGAR_MILL_DATA]
  optional: [LAND_RECORDS, SATELLITE_NDVI, WEATHER_IMD]
  min_confidence: 0.5

scoring:
  model: sugarcane_score_v1
  features:
    - {name: supply_regularity, source: SUGAR_MILL_DATA, weight: 0.20}
    - {name: sugarcane_yield_trend, source: SUGAR_MILL_DATA, weight: 0.15}
    - {name: mill_payment_regularity, source: SUGAR_MILL_DATA, weight: 0.15}
    - {name: land_area_acres, source: LAND_RECORDS, weight: 0.10}
    - {name: ndvi_crop_health, source: SATELLITE_NDVI, weight: 0.05}
    - {name: bureau_score, source: CREDIT_BUREAU, weight: 0.15}
    - {name: bank_stability, source: BANK_ACCOUNT_AA, weight: 0.20}

product:
  type: CROP_RECEIVABLE_LINKED
  amount_range: {min: 50000, max: 1000000}
  tenure_range: {min: 6, max: 18}
  schedule_template: harvest_linked_v1
  insurance_required: PMFBY
  moratorium_triggers:
    - {type: DROUGHT, threshold: declared, duration_months: 3}
    - {type: MILL_PAYMENT_DELAY, threshold_days: 60, duration_months: 2}

monitoring:
  cadence: weekly
  signals: [SUGAR_MILL_DATA, SATELLITE_NDVI, WEATHER_IMD]
  triggers:
    - {signal: mill_payment_delay_days, threshold: 30, intervention: SCHEDULE_ADJUST}
    - {signal: ndvi_crop_stress, threshold: 0.3, intervention: AGRONOMIST_VISIT}

graduation:
  min_repayment_months: 12
  min_on_time_rate: 0.85
  amount_multiplier: 1.5
  rate_reduction: 1.5

journey:
  entry: whatsapp_sugarcane_inbound
  greeting: "Namaste! Ganne ki kheti ke liye loan ki baat karte hain. Mill payment se EMI kategi."
