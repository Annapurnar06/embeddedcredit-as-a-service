segment:
  id: NBFC_BC
  version: 1
  channel: whatsapp
  languages: [hi, en]

data_sources:
  required: [CREDIT_BUREAU, BANK_ACCOUNT_AA, BC_NETWORK_DATA]
  optional: [GST_RETURNS, DEVICE_SCORE]
  min_confidence: 0.5

scoring:
  model: nbfc_bc_score_v1
  features:
    - {name: transaction_volume_trend, source: BC_NETWORK_DATA, weight: 0.25}
    - {name: active_customers, source: BC_NETWORK_DATA, weight: 0.15}
    - {name: bc_tenure_months, source: BC_NETWORK_DATA, weight: 0.10}
    - {name: commission_regularity, source: BC_NETWORK_DATA, weight: 0.10}
    - {name: bureau_score, source: CREDIT_BUREAU, weight: 0.15}
    - {name: bank_stability, source: BANK_ACCOUNT_AA, weight: 0.25}

product:
  type: BC_FLOAT_FINANCE
  amount_range: {min: 50000, max: 500000}
  tenure_range: {min: 3, max: 12}
  schedule_template: daily_settlement_v1
  insurance_required: false

monitoring:
  cadence: daily
  signals: [BC_NETWORK_DATA, BANK_ACCOUNT_AA]
  triggers:
    - {signal: transaction_drop_pct, threshold: 50, intervention: NETWORK_REVIEW}
    - {signal: settlement_failure, threshold: 3, intervention: ESCALATE}

graduation:
  min_repayment_months: 6
  min_on_time_rate: 0.90
  amount_multiplier: 1.5
  rate_reduction: 1.0

journey:
  entry: whatsapp_bc_inbound
  greeting: "Namaste! BC network ke liye float financing ki baat karte hain."
