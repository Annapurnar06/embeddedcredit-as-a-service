segment:
  id: E_RICKSHAW
  version: 1
  channel: whatsapp
  languages: [hi, bn]

data_sources:
  required: [CREDIT_BUREAU, BANK_ACCOUNT_AA, EV_TELEMATICS]
  optional: [UPI_TRANSACTION_DATA, DEVICE_SCORE]
  min_confidence: 0.4

scoring:
  model: e_rickshaw_score_v1
  features:
    - {name: daily_trips, source: EV_TELEMATICS, weight: 0.20}
    - {name: battery_health_pct, source: EV_TELEMATICS, weight: 0.15}
    - {name: upi_daily_collections, source: UPI_TRANSACTION_DATA, weight: 0.20}
    - {name: route_consistency, source: EV_TELEMATICS, weight: 0.05}
    - {name: bureau_score, source: CREDIT_BUREAU, weight: 0.15}
    - {name: bank_stability, source: BANK_ACCOUNT_AA, weight: 0.25}

product:
  type: E_RICKSHAW_FINANCE
  amount_range: {min: 30000, max: 200000}
  tenure_range: {min: 12, max: 36}
  schedule_template: daily_payout_linked_v1
  insurance_required: EV_COMPREHENSIVE
  moratorium_triggers:
    - {type: BATTERY_FAILURE, threshold: detected, duration_months: 1}
    - {type: FLOOD_WATERLOGGING, threshold: declared, duration_months: 1}

monitoring:
  cadence: daily
  signals: [EV_TELEMATICS, UPI_TRANSACTION_DATA]
  triggers:
    - {signal: daily_trip_drop_pct, threshold: 50, intervention: SCHEDULE_ADJUST}
    - {signal: battery_health_drop, threshold: 50, intervention: BATTERY_REPLACEMENT}

graduation:
  min_repayment_months: 12
  min_on_time_rate: 0.85
  amount_multiplier: 1.5
  rate_reduction: 1.5

journey:
  entry: whatsapp_erickshaw_inbound
  greeting: "Namaste! E-rickshaw loan ke liye baat karte hain. Daily kamai se EMI kategi."
